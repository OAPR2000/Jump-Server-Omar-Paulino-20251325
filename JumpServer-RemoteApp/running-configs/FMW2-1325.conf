FMW2-1325 # show system interface
config system interface
    edit "port1"
        set vdom "root"
        set ip 192.168.42.25 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "WAN-ISP"
        set snmp-index 1
        set secondary-IP enable
        config secondaryip
            edit 1
                set ip 200.25.13.25 255.255.255.224
                set allowaccess ping
            next
        end
    next
    edit "port2"
